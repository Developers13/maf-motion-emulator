[package]
name = "maf-motion-emulator"
version = "0.2.0"
description = "MAF Motion Emulator desktop UI"
edition = "2021"
rust-version = "1.77"

[lib]
name = "maf_motion_emulator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# exe 嵌入了 requireAdministrator 清单，`cargo test` 无法在非提权终端里执行 bin 测试目标；
# 逻辑测试都在 lib 里，这里关掉 bin 的测试目标。
[[bin]]
name = "maf-motion-emulator"
path = "src/main.rs"
test = false
bench = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde", "clock"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Console",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
