<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MAF Motion Emulator</title>
    <link rel="stylesheet" href="/src/styles/tokens.css" />
    <link rel="stylesheet" href="/src/styles/app.css" />
  </head>
  <body>
    <div class="app">
      <aside class="rail">
        <header class="brand">
          <div class="mark" aria-hidden="true">M<span class="mark-dot"></span></div>
          <div class="brand-text">
            <h1>MAF Motion Emulator</h1>
            <div class="project-path" id="project-path" title="">…</div>
          </div>
        </header>

        <section class="rail-section">
          <div class="rail-head">
            <span class="eyebrow">学号</span>
            <span class="rail-count" id="selection-count">0 / 0</span>
            <div class="rail-tools">
              <button type="button" class="tiny" id="select-all">全选</button>
              <button type="button" class="tiny" id="select-none">清空</button>
            </div>
          </div>
          <div class="student-list" id="student-list" role="group" aria-label="学号列表"></div>
          <div class="empty" id="student-empty" hidden>
            user-list.json 里还没有学号<br />
            <span class="muted">在「设置 → 用户列表」添加，或点热重载</span>
          </div>
        </section>

        <div class="rail-actions">
          <div class="rail-runmode">
            <span class="eyebrow">执行模式</span>
            <div class="segmented" id="mode-switch" role="group" aria-label="执行模式">
              <button type="button" class="seg is-active" data-mode="serial" aria-pressed="true">串行</button>
              <button type="button" class="seg" data-mode="parallel" aria-pressed="false">并行</button>
            </div>
            <label class="runmode-count" id="parallel-count-wrap" hidden>
              <span class="eyebrow">台数</span>
              <input class="input runmode-input" id="parallel-count" type="number" min="1" max="8" step="1" value="2" inputmode="numeric" />
            </label>
          </div>
          <button type="button" class="btn btn-primary" id="btn-start">开始运行</button>
          <button type="button" class="btn btn-danger" id="btn-stop">停止</button>
          <div class="rail-secondary">
            <button type="button" class="btn btn-ghost" id="btn-reload">热重载</button>
            <button type="button" class="btn btn-ghost" id="btn-settings">设置</button>
          </div>
        </div>
      </aside>

      <main class="workspace">
        <header class="work-head">
          <div class="status-pill" id="status-pill" data-tone="neutral">
            <span class="pill-dot"></span>
            <span id="status-text">待机</span>
          </div>
          <div class="work-progress" id="work-progress" hidden>
            <span id="progress-text"></span>
            <span class="track"><span class="bar" id="progress-bar"></span></span>
          </div>
          <div class="work-tools">
            <label class="switch">
              <input type="checkbox" id="autoscroll" checked />
              <span>自动滚动</span>
            </label>
            <button type="button" class="tiny" id="btn-clear">清空日志</button>
          </div>
        </header>

        <section class="log" id="log" aria-live="polite" aria-label="运行日志"></section>

        <footer class="statusbar">
          <span id="foot-left">正在读取环境…</span>
          <span id="foot-right"></span>
        </footer>
      </main>
    </div>

    <div class="modal-backdrop" id="settings-backdrop" hidden>
      <div class="modal modal-settings" role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="settings-title">
        <header class="modal-head">
          <div>
            <h2 id="settings-title">设置</h2>
            <p class="modal-sub" id="settings-sub"></p>
          </div>
          <button type="button" class="icon-btn" id="settings-close" aria-label="关闭设置">×</button>
        </header>
        <nav class="tabs" role="tablist" aria-label="设置分区">
          <button type="button" class="tab is-active" role="tab" aria-selected="true" data-tab="users">用户列表</button>
          <button type="button" class="tab" role="tab" aria-selected="false" data-tab="env">运行环境</button>
          <button type="button" class="tab" role="tab" aria-selected="false" data-tab="rules">运行规则</button>
        </nav>
        <div class="modal-body" id="settings-body"></div>
        <footer class="modal-foot">
          <span class="form-error" id="settings-error"></span>
          <button type="button" class="btn btn-ghost" id="settings-cancel">取消</button>
          <button type="button" class="btn btn-primary" id="settings-save">保存</button>
        </footer>
      </div>
    </div>

    <div class="modal-backdrop" id="confirm-backdrop" hidden>
      <div class="modal modal-confirm" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
        <h2 id="confirm-title"></h2>
        <p class="confirm-body" id="confirm-body"></p>
        <div class="confirm-actions">
          <button type="button" class="btn btn-ghost" id="confirm-cancel">取消</button>
          <button type="button" class="btn btn-primary" id="confirm-ok">确认</button>
        </div>
      </div>
    </div>

    <div class="toasts" id="toasts" aria-live="polite"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
